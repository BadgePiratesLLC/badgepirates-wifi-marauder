name: UI simulator screenshots

# Nexus 0f35e128: render the badge's UI as PNGs on every push that touches
# it, no ESP32 attached. This is the "Kevin approves a design from his
# phone instead of a workbench" step - see sim/README.md for what these
# screenshots do and do not prove.

on:
  push:
    paths:
      - "src/hardware/badge_menu.*"
      - "src/hardware/touch_input.*"
      - "src/hardware/badge_nav.*"
      - "src/hardware/lv_disp_port.*"
      - "src/UI/**"
      - "include/UI/**"
      - "include/badge_ui_theme.h"
      - "include/lv_conf.h"
      - "sim/**"
  pull_request:
    paths:
      - "src/hardware/badge_menu.*"
      - "src/hardware/touch_input.*"
      - "src/hardware/badge_nav.*"
      - "src/hardware/lv_disp_port.*"
      - "src/UI/**"
      - "include/UI/**"
      - "include/badge_ui_theme.h"
      - "include/lv_conf.h"
      - "sim/**"
  workflow_dispatch: {}

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # esp32marauder-upstream is ALSO a direct submodule of this repo.
          # This stays false (not recursive/true, which would eagerly fetch
          # both on every checkout) - sim/vendor/lvgl and esp32marauder-upstream
          # each get their own targeted init below instead.
          submodules: false

      - name: Init LVGL submodule (Nexus 84f4e52c)
        run: git submodule update --init sim/vendor/lvgl

      - name: Init upstream submodule (Nexus 176cc276 - build.sh reads its configs.h for MARAUDER_VERSION)
        run: git submodule update --init esp32marauder-upstream

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Build simulator
        run: ./sim/build.sh

      - name: Render the four review screens
        run: |
          ./sim/out/badge_sim root sim/out      # 01_root.png, 02_submenu.png
          ./sim/out/badge_sim options sim/out    # 03_options.png
          ./sim/out/badge_sim pressed sim/out    # 04_pressed.png

      - name: Render the status bar scenarios (Nexus c39cd3b3)
        run: ./sim/out/badge_sim statusbar sim/out   # 10-16_statusbar_*.png

      - name: Render Candidate B - FlatOutline (Nexus 84f4e52c deliverable: 2 treatments, not 1)
        run: |
          ./sim/out/badge_sim treatmentB sim/out         # treatmentB_01_root.png, treatmentB_02_submenu.png
          ./sim/out/badge_sim treatmentBPressed sim/out  # treatmentB_04_pressed.png

      - uses: actions/upload-artifact@v4
        with:
          name: badge-ui-screenshots
          path: |
            sim/out/01_root.png
            sim/out/02_submenu.png
            sim/out/03_options.png
            sim/out/04_pressed.png
            sim/out/10_statusbar_off.png
            sim/out/11_statusbar_on_synced.png
            sim/out/12_statusbar_low_battery.png
            sim/out/13_statusbar_battery_unknown.png
            sim/out/14_statusbar_submenu.png
            sim/out/15_statusbar_battery_screen.png
            sim/out/16_statusbar_buzzer_toggle.png
            sim/out/treatmentB_01_root.png
            sim/out/treatmentB_02_submenu.png
            sim/out/treatmentB_04_pressed.png
          retention-days: 90
