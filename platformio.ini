; BSidesKC Badge - ESP32Marauder Port
; Board: ESP32-S3 with ILI9341 + FT6336U touch
; Phase 1.5: Upstream Marauder source integration

[env:bsideskc-badge]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 8MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = default_8MB.csv

; Pull in our src/ AND upstream Marauder sources (excluding the .ino)
build_src_filter =
	+<*>
	+<../esp32marauder-upstream/esp32_marauder/*.cpp>
	-<../esp32marauder-upstream/esp32_marauder/esp32_marauder.ino>

; Use upstream bundled ESPAsyncWebServer + PIO registry libs
lib_extra_dirs =
	esp32marauder-upstream/libraries

lib_deps =
	bodmer/TFT_eSPI
	https://github.com/aselectroworks/Arduino-FT6336U
	h2zero/NimBLE-Arduino@^1.4.0
	adafruit/Adafruit NeoPixel@^1.10.7
	adafruit/Adafruit MAX1704X
	adafruit/Adafruit BusIO@^1.17.1
	MaffooClock/ESP32RotaryEncoder@^1.1.0
	ArduinoJson@^7
	https://github.com/ivanseidel/LinkedList.git
	marian-craciunescu/ESP32Ping@^1.7
	me-no-dev/AsyncTCP@^1.1.1
	stevemarple/MicroNMEA@^2.0.6
	plerup/EspSoftwareSerial@^8.1.0

; LDF must deep-scan upstream sources for their #includes
lib_ldf_mode = deep+

build_flags =
	; Board identity
	-D BSIDESKC_BADGE
	-D ESP32S3_DEV
	-D ARDUINO_USB_CDC_ON_BOOT=0

	; TFT_eSPI config via build flags (no User_Setup.h needed)
	-D USER_SETUP_LOADED
	-D ILI9341_DRIVER
	-D TFT_INVERSION_ON=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MOSI=11
	-D TFT_SCLK=12
	-D TFT_CS=10
	-D TFT_DC=5
	-D TFT_RST=4
	-D TFT_BL=6
	-D TFT_BACKLIGHT_ON=HIGH
	-D TOUCH_CS=-1
	-D SPI_FREQUENCY=40000000
	-D USE_DMA=1
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_FONT8=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT

	; Include paths — our include/ first for config overrides
	-I include
	-I esp32marauder-upstream/esp32_marauder
	; Force-include our config so upstream configs.h guard is pre-set
	-include include/marauder_config.h

	; Allow multiple definitions (upstream GpsInterface.cpp re-declares Serial2)
	-Wl,--allow-multiple-definition

[env:bsideskc-badge-production]
extends = env:bsideskc-badge
build_flags =
	${env:bsideskc-badge.build_flags}
	-DPRODUCTION_BUILD
	-DNDEBUG
	-Os
build_unflags = -Og -O0 -O1 -O2 -O3

; CC13/BSidesKC25 hardware revision — screen mounted on the back of the board
; instead of the front (physically rotated 180° vs CC14/BSidesKC26). Pins are
; identical (confirmed against the CC13 schematic, Nexus 2977d950); only the
; display/touch orientation differs.
[env:bsideskc-badge-cc13]
extends = env:bsideskc-badge
build_flags =
	${env:bsideskc-badge.build_flags}
	-D BADGE_HW_CC13
