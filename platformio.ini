; BSidesKC Badge - ESP32Marauder Port
; Board: ESP32-S3 with ILI9341 + FT6336U touch
; Reference: QACode_27 platformio.ini + PORTING_PLAN.md

[env:bsideskc-badge]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv

lib_deps =
	bodmer/TFT_eSPI
	https://github.com/aselectroworks/Arduino-FT6336U
	h2zero/NimBLE-Arduino@^1.4.0
	adafruit/Adafruit NeoPixel@^1.10.7
	adafruit/Adafruit MAX1704X
	adafruit/Adafruit BusIO@^1.17.1
	MaffooClock/ESP32RotaryEncoder@^1.1.0
	ArduinoJson@^7

build_flags =
	; Board identity
	-D BSIDESKC_BADGE
	-D ESP32S3_DEV
	-D ARDUINO_USB_CDC_ON_BOOT=1

	; TFT_eSPI config via build flags (no User_Setup.h needed)
	-D USER_SETUP_LOADED
	-D ILI9341_DRIVER
	-D TFT_INVERSION_ON=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MOSI=11
	-D TFT_SCLK=12
	-D TFT_CS=10
	-D TFT_DC=5
	-D TFT_RST=4
	-D TFT_BL=6
	-D TFT_BACKLIGHT_ON=HIGH
	-D TOUCH_CS=-1
	-D SPI_FREQUENCY=40000000
	-D USE_DMA=1
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_FONT8=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT

	; Include paths
	-I include
