<!DOCTYPE html>
<!--
  BSidesKC Badge simulator — interactive WASM page (Nexus 7b1f65b2).

  Loads sim/build_wasm.sh's output (badge_sim_wasm.js/.wasm) — the same
  badge_menu.cpp/touch_input.cpp/badge_nav.cpp/UI/CardKit.cpp the native
  headless sim (sim/build.sh, sim/README.md) and the real firmware both
  compile, running through the real fixedTick() gating (see
  sim_wasm_main.cpp). This page only does two things neither the native
  sim nor the firmware need: blit the framebuffer to a <canvas> every
  frame, and turn mouse clicks into the same sim_set_touch() feed the
  native sim's scripted taps use.

  Copied to sim/out/index.html by build_wasm.sh; not itself part of the
  built artifact.
-->
<html>
<head>
<meta charset="utf-8">
<title>BSidesKC Badge simulator (WASM)</title>
<style>
  body { background: #1a1a1a; color: #ddd; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
  #badge {
    image-rendering: pixelated;
    border: 2px solid #444;
    cursor: pointer;
    touch-action: none; /* no scroll/zoom gestures eating our taps on a phone/tablet */
  }
  #status { margin-top: 12px; color: #888; font-size: 13px; }
  #encoder { margin-top: 12px; }
  #encoder button {
    background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px;
    font-size: 14px; padding: 8px 16px; margin: 0 6px; cursor: pointer;
  }
  #encoder button:active { background: #444; }
</style>
</head>
<body>
  <h2>BSidesKC Badge simulator</h2>
  <p>Click cards and the back button, same as tapping the real touchscreen. No badge, no checkout, no terminal.
  Use the &uarr;/press/&darr; controls below (or the arrow/Enter keys) to page past the visible cards, same as
  the badge's own rotary encoder knob on real hardware.</p>
  <canvas id="badge" width="320" height="240" style="width: 640px; height: 480px;"></canvas>
  <div id="encoder">
    <button id="encUp" title="Encoder up (or the &uarr; key)">&uarr;</button>
    <button id="encPress" title="Encoder press / select (or the Enter key)">press</button>
    <button id="encDown" title="Encoder down (or the &darr; key)">&darr;</button>
  </div>
  <div id="status">loading...</div>

  <script src="badge_sim_wasm.js"></script>
  <script>
    const canvas = document.getElementById('badge');
    const statusEl = document.getElementById('status');

    // Canvas resolution (320x240, the real panel's rotated framebuffer
    // size — sim_wasm_main.cpp's THEME_SCREEN_W/H) is fixed by the CSS
    // width/height above (2x, so cards are comfortably clickable on a
    // laptop trackpad). Map a mouse event's CSS-space position back to
    // canvas-pixel space so sim_wasm_pointer() gets real panel
    // coordinates, not doubled ones.
    function toCanvasXY(evt) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = Math.round((evt.clientX - rect.left) * scaleX);
      const y = Math.round((evt.clientY - rect.top) * scaleY);
      return [Math.max(0, Math.min(canvas.width - 1, x)), Math.max(0, Math.min(canvas.height - 1, y))];
    }

    BadgeSimModule().then((Module) => {
      const pointer = Module.cwrap('sim_wasm_pointer', null, ['number', 'number', 'number']);
      statusEl.textContent = 'running';

      let down = false;
      canvas.addEventListener('mousedown', (e) => {
        down = true;
        const [x, y] = toCanvasXY(e);
        pointer(1, x, y);
      });
      canvas.addEventListener('mousemove', (e) => {
        if (!down) return;
        const [x, y] = toCanvasXY(e);
        pointer(1, x, y);
      });
      window.addEventListener('mouseup', (e) => {
        if (!down) return;
        down = false;
        const [x, y] = toCanvasXY(e);
        pointer(0, x, y);
      });

      // Same gesture, touch input (phone/tablet) instead of a mouse —
      // touch-action:none above stops the browser eating these as scroll.
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const [x, y] = toCanvasXY(e.touches[0]);
        down = true;
        pointer(1, x, y);
      });
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!down) return;
        const [x, y] = toCanvasXY(e.touches[0]);
        pointer(1, x, y);
      });
      canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (!down) return;
        down = false;
        // No coordinates on touchend; last-known position already released.
        pointer(0, 0, 0);
      });

      // Rotary encoder stand-in (Nexus 11b37408) - the badge's real
      // secondary input for paging past a screen's visible cards
      // (badge_menu.cpp's adaptedMaxVisible()/adaptedEnsurePageVisible()),
      // with no touch equivalent by design. Without this, anything past
      // the first page of any menu - including root's own Device/Badge/
      // Reboot rows - was unreachable by mouse in this page.
      const encUp = Module.cwrap('sim_wasm_encoder_up', null, []);
      const encDown = Module.cwrap('sim_wasm_encoder_down', null, []);
      const encPress = Module.cwrap('sim_wasm_encoder_press', null, []);
      document.getElementById('encUp').addEventListener('click', () => encUp());
      document.getElementById('encDown').addEventListener('click', () => encDown());
      document.getElementById('encPress').addEventListener('click', () => encPress());
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') { e.preventDefault(); encUp(); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); encDown(); }
        else if (e.key === 'Enter') { e.preventDefault(); encPress(); }
      });
    }).catch((err) => {
      statusEl.textContent = 'failed to load: ' + err;
      console.error(err);
    });
  </script>
</body>
</html>
